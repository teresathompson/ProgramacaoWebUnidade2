<!DOCTYPE html>
<html lang="pt-br">

<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Spinner Frango Rotisserie</title>

<style>

body {
    display: flex;
    justify-content: center;
    align-items: center;
    height: 100vh;
    background: #222;
}

/* Spinner inteiro */
.rotisserie {
    position: relative;
    width: 180px;
    height: 100px;
}

/* Espeto */
.spit {
    position: absolute;

    width: 180px;
    height: 5px;

    background: #aaa;

    top: 48px;
    left: 0;

    border-radius: 5px;

    box-shadow: 0 2px 3px rgba(0,0,0,.5);
}

/* Cabo do espeto */
.spit::before {
    content: "";

    position: absolute;

    width: 25px;
    height: 12px;

    background: #333;

    left: -15px;
    top: -4px;

    border-radius: 5px;
}

/* ponta do espeto */
.spit::after {
    content: "";

    position: absolute;

    right: -10px;
    top: -3px;

    width: 0;
    height: 0;

    border-top: 5px solid transparent;
    border-bottom: 5px solid transparent;
    border-left: 12px solid #aaa;
}


/* Container do frango */
.chicken {
    position: absolute;

    width: 100px;
    height: 70px;

    left: 40px;
    top: 15px;

    animation: assar 1.4s linear infinite;

    transform-style: preserve-3d;
}


/* Corpo do frango */
.body {
    position: absolute;

    width: 85px;
    height: 58px;

    left: 8px;
    top: 6px;

    background:
        radial-gradient(
            ellipse at 40% 30%,
            #ffd27a 0%,
            #d98b35 45%,
            #9c501f 80%,
            #713514 100%
        );

    border-radius: 50% 55% 45% 50%;

    box-shadow:
        inset -8px -7px 10px rgba(80,30,0,.35),
        inset 7px 5px 10px rgba(255,230,150,.35),
        0 4px 6px rgba(0,0,0,.4);
}


/* Asa */
.body::before {
    content: "";

    position: absolute;

    width: 42px;
    height: 24px;

    left: 22px;
    top: 17px;

    background: #bd6d28;

    border-radius:
        60% 30% 60% 40%;

    transform: rotate(-12deg);

    box-shadow:
        inset -4px -3px 5px rgba(70,20,0,.3);
}


/* Coxa */
.body::after {
    content: "";

    position: absolute;

    width: 38px;
    height: 17px;

    right: -17px;
    bottom: 7px;

    background: #c8792f;

    border-radius: 50%;

    transform: rotate(20deg);

    box-shadow:
        inset -5px -3px 5px rgba(80,30,0,.3);
}


/* ossinho da coxa */
.bone {
    position: absolute;

    width: 25px;
    height: 7px;

    background: #eee1c4;

    right: -25px;
    bottom: 11px;

    border-radius: 10px;
}


/* outra ponta do osso */
.bone::after {
    content: "";

    position: absolute;

    width: 10px;
    height: 10px;

    right: -4px;
    top: -2px;

    background: #eee1c4;

    border-radius: 50%;
}


/* 
   O truque:
   scaleY faz parecer que o frango
   está girando sobre o espeto.
*/
@keyframes assar {

    0% {
        transform: scaleY(1);
        filter: brightness(1);
    }

    25% {
        transform: scaleY(0.25);
        filter: brightness(.75);
    }

    50% {
        transform: scaleY(-1);
        filter: brightness(.6);
    }

    75% {
        transform: scaleY(-0.25);
        filter: brightness(.75);
    }

    100% {
        transform: scaleY(1);
        filter: brightness(1);
    }
}

/* Chicken */
.chicken {
    position: absolute;
    width: 100px;
    height: 70px;

    left: 40px;
    top: 15px;

    animation: assar 2s linear infinite;

    /* Gives the rotation some depth */
    transform-origin: center center;
}

/* Body */
.body {
    position: absolute;

    width: 85px;
    height: 58px;

    left: 8px;
    top: 6px;

    background:
        radial-gradient(
            ellipse at 35% 25%,
            #ffd98a 0%,
            #e5a047 30%,
            #bd6828 65%,
            #743414 100%
        );

    border-radius: 48% 55% 48% 52%;

    box-shadow:
        inset 8px 6px 10px rgba(255, 230, 160, .35),
        inset -10px -8px 12px rgba(75, 25, 0, .4),
        0 5px 7px rgba(0,0,0,.4);

    overflow: hidden;
}

/* Moving light over chicken */
.body .shine {
    position: absolute;

    width: 35px;
    height: 80px;

    top: -10px;
    left: -40px;

    background: linear-gradient(
        90deg,
        transparent,
        rgba(255,255,255,.30),
        transparent
    );

    transform: rotate(15deg);

    animation: shine 2s linear infinite;
}


/* Rotisserie rotation illusion */
@keyframes assar {

    0% {
        transform:
            perspective(250px)
            rotateX(0deg);
    }

    25% {
        transform:
            perspective(250px)
            rotateX(35deg);

        filter: brightness(.82);
    }

    50% {
        transform:
            perspective(250px)
            rotateX(0deg);

        filter: brightness(.65);
    }

    75% {
        transform:
            perspective(250px)
            rotateX(-35deg);

        filter: brightness(.82);
    }

    100% {
        transform:
            perspective(250px)
            rotateX(0deg);

        filter: brightness(1);
    }
}


@keyframes shine {

    0% {
        left: -40px;
        opacity: 0;
    }

    25% {
        opacity: 1;
    }

    50% {
        left: 100px;
        opacity: 0;
    }

    100% {
        left: 100px;
        opacity: 0;
    }
}

/* calor/fogo embaixo */
.heat {
    position: absolute;

    width: 110px;
    height: 15px;

    bottom: -5px;
    left: 35px;

    background:
        radial-gradient(
            ellipse,
            rgba(255,100,0,.8),
            rgba(255,0,0,.2) 50%,
            transparent 70%
        );

    filter: blur(4px);

    animation: calor .5s ease-in-out infinite alternate;
}


@keyframes calor {

    from {
        opacity: .4;
        transform: scaleX(.9);
    }

    to {
        opacity: 1;
        transform: scaleX(1.1);
    }
}

</style>
</head>


<body>

<div class="rotisserie">

    <div class="spit"></div>

    <div class="chicken">

        <div class="body">
            <div class="shine"></div>
            <div class="bone"></div>
        </div>

    </div>

    <div class="heat"></div>

</div>

</body>
</html>
