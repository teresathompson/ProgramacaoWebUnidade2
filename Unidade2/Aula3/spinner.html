<!DOCTYPE html>

<html lang="pt-br">

<head>

<meta charset="UTF-8">

<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Exemplo de Animação</title>

<style>

@keyframes girar {
    0% {
        transform: rotate(0deg);
    }
    100% {
        transform: rotate(360deg);
    }
}

/* Washing machine outer door */
.spinner {
    width: 90px;
    height: 90px;

    border: 9px solid #d9dde2;
    border-radius: 50%;

    background:
        radial-gradient(
            circle,
            #bde8f5 0%,
            #8fd3e8 55%,
            #4d9db8 100%
        );

    box-shadow:
        inset 0 0 10px rgba(0, 0, 0, 0.25),
        0 3px 8px rgba(0, 0, 0, 0.2);

    position: relative;
    overflow: hidden;
}

/* Container that rotates */
.clothes {
    position: absolute;
    width: 100%;
    height: 100%;

    animation: girar 1.8s linear infinite;
}

/* Individual pieces of clothing */
.clothes span {
    position: absolute;
    display: block;

    width: 28px;
    height: 20px;

    border-radius: 40% 60% 50% 40%;
}

/* Red clothing */
.clothes span:nth-child(1) {
    background: #e74c3c;
    top: 15px;
    left: 30px;

    transform: rotate(30deg);
}

/* Yellow clothing */
.clothes span:nth-child(2) {
    background: #f1c40f;
    top: 45px;
    left: 12px;

    width: 32px;
    height: 18px;

    transform: rotate(-20deg);
}

/* Purple clothing */
.clothes span:nth-child(3) {
    background: #9b59b6;
    top: 50px;
    left: 48px;

    width: 25px;
    height: 27px;

    transform: rotate(45deg);
}

/* Dark blue clothing */
.clothes span:nth-child(4) {
    background: #34495e;
    top: 25px;
    left: 55px;

    width: 23px;
    height: 17px;
}

/* Glass reflection */
.spinner::after {
    content: "";

    position: absolute;
    top: 10px;
    left: 17px;

    width: 45px;
    height: 18px;

    border-radius: 50%;

    background: rgba(255, 255, 255, 0.35);

    transform: rotate(-25deg);

    pointer-events: none;
}

</style>

</head>

<body>

<div class="spinner">

    <div class="clothes">
            <span></span>
            <span></span>
            <span></span>
            <span></span>
        </div>
</div>

</body>

</html>
