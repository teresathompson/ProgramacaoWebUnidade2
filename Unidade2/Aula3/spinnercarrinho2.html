<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>

    <style>
       @keyframes correr {
    from {
        transform: rotate(0deg);
    }

    to {
        transform: rotate(360deg);
    }
}

/* PISTA */
.spinner {
    position: relative;

    width: 140px;
    height: 140px;

    border: 28px solid #181818;
    border-radius: 50%;

    /* linha branca no meio da pista */
    outline: 3px dashed white;
    outline-offset: -15px;

    margin: 50px;
}


/* elemento invisível que gira */
.movimento {
    position: absolute;

    width: 100%;
    height: 100%;

    top: 0;
    left: 0;

    animation: correr 2s linear infinite;
}


/* CARRO VISTO DE CIMA */
.carro {
    position: absolute;

    width: 18px;
    height: 38px;

    background: #e53935;

    border-radius: 7px 7px 5px 5px;

    top: -34px;
    left: 50%;

    transform: translateX(-50%);
}


/* vidro visto de cima */
.vidro {
    position: absolute;

    width: 12px;
    height: 12px;

    background: #8ed6ff;

    border-radius: 3px;

    top: 8px;
    left: 3px;

    box-shadow:
        inset 0 0 3px rgba(255,255,255,.8);
}


/* rodas */
.roda {
    position: absolute;

    width: 4px;
    height: 9px;

    background: #050505;

    border-radius: 2px;
}


/* rodas dianteiras */
.roda-esq-1 {
    left: -3px;
    top: 5px;
}

.roda-dir-1 {
    right: -3px;
    top: 5px;
}


/* rodas traseiras */
.roda-esq-2 {
    left: -3px;
    bottom: 5px;
}

.roda-dir-2 {
    right: -3px;
    bottom: 5px;
}
    </style>
</head>
<body>
    <div class="spinner">
    <div class="movimento">
        <div class="carro">
            <div class="vidro"></div>
            <div class="roda roda-esq-1"></div>
            <div class="roda roda-dir-1"></div>
            <div class="roda roda-esq-2"></div>
            <div class="roda roda-dir-2"></div>
        </div>
    </div>
</div>
</body>
</html>
