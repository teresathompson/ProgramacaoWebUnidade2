<!DOCTYPE html>

<html lang="pt-br">

<head>

<meta charset="UTF-8">

<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Exemplo de Animação</title>

<style>

@keyframes girar {
0% { transform: rotate(0deg); }
100% { transform: rotate(360deg); }
}
.spinner {
border: 8px solid #f3f3f3; /* Cinza claro */
border-top: 8px solid #3498db; /* Azul */
border-radius: 50%;
width: 50px;
height: 50px;
animation: girar 1s linear infinite; /* Animação de rotação contínua */
}
</style>

</head>

<body>

<div class="spinner"></div>

</body>

</html>
